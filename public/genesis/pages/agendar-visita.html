<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendamento de Visita | Projeto Gênese</title>
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="icon" type="image/png" href="../imgs/logo.png" />
  </head>
  <body>
    <header class="navbar">
      <div class="navbar-inner">
        <a class="brand" href="../index.html">
          <img src="../imgs/logo.png" alt="Logo Projeto Gênese" class="brand-logo" />
          <span class="brand-text">Projeto <strong>Gênese</strong></span>
        </a>
        <button class="hamburger" id="hamburger" aria-label="Abrir menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <nav class="nav-links" id="navLinks">
          <a href="../index.html" class="active">Início</a>
          <a href="areas-visitantes.html">Áreas de Visitantes</a>
          <a href="areas-tecnicas.html">Áreas Técnicas</a>
          <a href="documentacao.html">Documentação Técnica</a>
          <a href="curiosidades.html">Curiosidades de Manejo</a>
          <a href="origem.html">Origem do Parque</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="section page-header">
        <h1>Agendamento de Visita</h1>
        <p>Converse com nosso assistente virtual para marcar sua visita.</p>
      </section>

      <div class="chat-container" id="chat">
        <div class="chat-message bot">
          Olá! Sou o assistente do Projeto Gênese. Qual é o seu nome?
        </div>
      </div>

      <div class="chat-input">
        <input type="text" id="userInput" placeholder="Digite sua resposta..." />
        <button id="sendBtn">Enviar</button>
      </div>
    </main>

    <script>
      const chat = document.getElementById("chat");
      const input = document.getElementById("userInput");
      const sendBtn = document.getElementById("sendBtn");

      let step = 0;
      let agendamento = {};

      function addMessage(text, sender) {
        const msg = document.createElement("div");
        msg.className = "chat-message " + sender;
        const span = document.createElement("span");
        span.textContent = text;
        if (sender === "bot") {
          const avatar = document.createElement("img");
          avatar.src = "../imgs/icon/visitantes/dinosaur.png";
          avatar.className = "chat-avatar";
          msg.appendChild(avatar);
          msg.appendChild(span);
        } else if (sender === "user") {
          const avatar = document.createElement("img");
          avatar.src = "../imgs/icon/visitantes/user.png";
          avatar.className = "chat-avatar";
          msg.appendChild(span);
          msg.appendChild(avatar);
        }
        chat.appendChild(msg);
        msg.scrollIntoView({ behavior: "smooth" });
      }

      function addBotMessage(text, delay = 1000) {
        const typing = showTyping();
        setTimeout(() => {
          chat.removeChild(typing);
          addMessage(text, "bot");
        }, delay);
      }

      function showTyping() {
        const typing = document.createElement("div");
        typing.className = "chat-message bot typing-indicator";
        typing.innerHTML = "<span></span><span></span><span></span>";
        chat.appendChild(typing);
        chat.scrollTop = chat.scrollHeight;
        return typing;
      }

      function handleUserInput(text) {
        if (step === 0) {
          agendamento.nome = text;
          addBotMessage("Prazer, " + text + "! Qual é o seu e-mail?");
          step++;
        } else if (step === 1) {
          if (!text.includes("@")) {
            addBotMessage("Ops! Por favor, insira um e-mail válido com '@'.");
            return;
          }
          agendamento.email = text;
          addBotMessage("Obrigado! Escolha a data da visita:");

          const dateInput = document.createElement("input");
          dateInput.type = "date";
          dateInput.className = "chat-date";
          dateInput.min = new Date().toISOString().split("T")[0];

          chat.appendChild(dateInput);
          chat.scrollTop = chat.scrollHeight;

          dateInput.onchange = () => {
            agendamento.data = dateInput.value;
            addBotMessage("Perfeito. Agora escolha o horário:");

            const select = document.createElement("select");
            select.className = "chat-time";

            for (let h = 8; h <= 17; h++) {
              const option = document.createElement("option");
              option.value = h.toString().padStart(2, "0") + ":00";
              option.textContent = h + "h";
              select.appendChild(option);
            }

            select.onchange = () => {
              agendamento.hora = select.value;
              finalizarAgendamento(agendamento, select);
            };

            chat.appendChild(select);
            chat.scrollTop = chat.scrollHeight;
            step++;
          };
        }
      }

      sendBtn.addEventListener("click", () => {
        const text = input.value.trim();
        if (!text) return;
        addMessage(text, "user");
        input.value = "";
        handleUserInput(text);
      });

      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          sendBtn.click();
        }
      });

      async function finalizarAgendamento(agendamento, select) {
        select.disabled = true;
        addBotMessage("Enviando a confirmação por e-mail...", 300);

        try {
          const resposta = await fetch("https://formsubmit.co/ajax/gugallo1607@gmail.com", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({
              _subject: "Novo agendamento - Projeto Gênese",
              _cc: agendamento.email,
              _template: "table",
              _captcha: "false",
              nome: agendamento.nome,
              email: agendamento.email,
              data: agendamento.data,
              horario: agendamento.hora,
            }),
          });

          if (!resposta.ok) throw new Error("Falha ao enviar a confirmação");

          const card = document.createElement("div");
          card.className = "chat-summary";
          card.textContent =
            "Agendamento concluído! Enviamos os detalhes para o seu e-mail e para o responsável pelo parque.";
          chat.appendChild(card);
          card.scrollIntoView({ behavior: "smooth" });
          step++;
        } catch (error) {
          console.error(error);
          select.disabled = false;
          addBotMessage(
            "Não foi possível enviar a confirmação agora. Verifique os dados e tente escolher o horário novamente.",
          );
        }
      }
    </script>
  </body>
</html>
