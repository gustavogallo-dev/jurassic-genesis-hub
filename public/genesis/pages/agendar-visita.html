<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendamento de Visita | Projeto Gênese</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" type="image/png" href="../imgs/logo.png" />
    <style>
      .chat-container {
        max-width: 600px;
        margin: 2rem auto;
        background: #f9f9f9;
        border-radius: 8px;
        padding: 1rem;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      }
      .chat-message {
        margin: 0.5rem 0;
        padding: 0.5rem 1rem;
        border-radius: 6px;
      }
      .bot {
        background: #e0f7fa;
        text-align: left;
      }
      .user {
        background: #c8e6c9;
        text-align: right;
      }
      .chat-input {
        display: flex;
        margin-top: 1rem;
      }
      .chat-input input {
        flex: 1;
        padding: 0.5rem;
        border-radius: 6px;
        border: 1px solid #ccc;
        margin-bottom: 1rem;
      }
      .chat-input button {
        margin-left: 0.5rem;
        margin-bottom: 1rem;
        padding: 0.5rem 1rem;
      }

      .typing-indicator {
        display: inline-block;
        background: #e0f7fa;
        border-radius: 12px;
        padding: 6px 12px;
        margin: 6px 0;
      }

      .typing-indicator span {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin: 0 2px;
        background: #555;
        border-radius: 50%;
        animation: bounce 1.2s infinite;
      }

      .chat-date {
        margin: 8px 0;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 1rem;
      }

      .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <header class="navbar">
      <div class="navbar-inner">
        <a class="brand" href="../index.html">
          <img src="../imgs/logo.png" alt="Logo Projeto Gênese" class="brand-logo" />
          <span class="brand-text">Projeto <strong>Gênese</strong></span>
        </a>
        <button class="hamburger" id="hamburger" aria-label="Abrir menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <nav class="nav-links" id="navLinks">
          <a href="../index.html" class="active">Início</a>
          <a href="areas-visitantes.html">Áreas de Visitantes</a>
          <a href="areas-tecnicas.html">Áreas Técnicas</a>
          <a href="documentacao.html">Documentação Técnica</a>
          <a href="curiosidades.html">Curiosidades de Manejo</a>
          <a href="origem.html">Origem do Parque</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="section page-header">
        <h1>Agendamento de Visita</h1>
        <p>Converse com nosso assistente virtual para marcar sua visita.</p>
      </section>

      <div class="chat-container" id="chat">
        <div class="chat-message bot">
          Olá! Sou o assistente do Projeto Gênese. Qual é o seu nome?
        </div>
      </div>

      <div class="chat-input">
        <input type="text" id="userInput" placeholder="Digite sua resposta..." />
        <button id="sendBtn">Enviar</button>
      </div>
    </main>

    <script>
      const chat = document.getElementById("chat");
      const input = document.getElementById("userInput");
      const sendBtn = document.getElementById("sendBtn");

      let step = 0;
      let agendamento = {};

      function addMessage(text, sender) {
        const msg = document.createElement("div");
        msg.className = "chat-message " + sender;
        msg.textContent = text;
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
      }

      function addBotMessage(text) {
        addMessage(text, "bot");
      }

      function handleUserInput(text) {
        if (step === 0) {
          agendamento.nome = text;
          addBotMessage("Prazer, " + text + "! Qual é o seu e-mail?");
          step++;
        } else if (step === 1) {
          agendamento.email = text;
          addBotMessage("Obrigado! Escolha a data da visita:");

          const dateInput = document.createElement("input");
          dateInput.type = "date";
          dateInput.className = "chat-date";

          dateInput.onchange = () => {
            agendamento.data = dateInput.value;
            addBotMessage("Perfeito. Agora escolha o horário:");

            const select = document.createElement("select");
            select.className = "chat-time";
            for (let h = 8; h <= 17; h++) {
              const option = document.createElement("option");
              option.value = h + ":00";
              option.textContent = h + "h";
              select.appendChild(option);
            }

            select.onchange = () => {
              agendamento.hora = select.value;
              addBotMessage("Agendamento concluído! 🎉");
              addBotMessage(
                `Resumo: ${agendamento.nome}, ${agendamento.email}, ${agendamento.data} às ${agendamento.hora}`,
              );
              step++;
            };

            chat.appendChild(select);
            chat.scrollTop = chat.scrollHeight;
            step++;
          };

          chat.appendChild(dateInput);
          chat.scrollTop = chat.scrollHeight;
          step++;
        }
      }

      sendBtn.addEventListener("click", () => {
        const text = input.value.trim();
        if (!text) return;
        addMessage(text, "user");
        input.value = "";
        handleUserInput(text);
      });

      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          sendBtn.click();
        }
      });

      function showTyping() {
        const typing = document.createElement("div");
        typing.className = "chat-message bot typing-indicator";
        typing.innerHTML = "<span></span><span></span><span></span>";
        chat.appendChild(typing);
        chat.scrollTop = chat.scrollHeight;
        return typing;
      }

      function addBotMessage(text, delay = 1000) {
        const typing = showTyping();
        setTimeout(() => {
          chat.removeChild(typing);
          addMessage(text, "bot");
        }, delay);
      }
    </script>
  </body>
</html>
